name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Formato (gofmt)
        run: |
          sin_formato="$(gofmt -l .)"
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin formatear:"
            echo "$sin_formato"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Un único perfil: el repo no tiene pruebas de integración en CI. La
      # etiqueta "aws" es opt-in y pega contra el bucket real (ver README).
      # Si aparece una etiqueta "integration", se corre acá con su propio
      # perfil y se unen con gocovmerge antes de convertir.
      - name: Test con cobertura
        run: go test ./... -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out

      - name: Instalar herramientas de cobertura
        run: |
          go install github.com/boumenot/gocover-cobertura@v1.5.0
          pip install --user diff-cover==11.0.1

      - name: Convertir a Cobertura XML
        run: gocover-cobertura < coverage.out > coverage.xml

      - name: Cobertura total (resumen)
        run: |
          {
            echo "## Cobertura total"
            echo
            echo "$(go tool cover -func=coverage.out | tail -n 1)"
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out > coverage-func.txt

      # Segundo gate, sobre el total del repo: ninguna rama puede bajarlo de 85 %.
      - name: Gate de cobertura total (>= 85 %)
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')"
          echo "Cobertura total: ${total} %"
          awk -v t="${total}" 'BEGIN { exit (t >= 85) ? 0 : 1 }'

      - name: Gate de cobertura sobre el código nuevo (>= 85 %)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=85 \
            --markdown-report diff-cover.md || status=$?
          if [ -f diff-cover.md ]; then
            { echo; echo "## Cobertura del código nuevo"; echo; cat diff-cover.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${status:-0}"

      - name: Subir reportes de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.xml
            coverage-func.txt
            diff-cover.md
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Trivy (vulnerabilidades, secretos y misconfiguraciones)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  semgrep:
    # Informativo por ahora: no corta el job. Pasa a gate en v0.14.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep (p/default)
        continue-on-error: true
        run: |
          pip install --user semgrep==1.184.0
          semgrep scan --config p/default --metrics=off --quiet --text --output semgrep.txt || true
          {
            echo "## Semgrep (informativo)"
            echo
            if [ -s semgrep.txt ]; then
              echo '```'
              head -c 60000 semgrep.txt
              echo '```'
            else
              echo "Sin hallazgos."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
