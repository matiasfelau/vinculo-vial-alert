services:
  alert:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://alert:alert@alert-db:5432/alert?sslmode=disable
      VEHICLE_INTERNAL_URL: http://vinculo-vial-vehicle:8081
      VEHICLE_TIMEOUT_MS: 2000
      RABBITMQ_URL: amqp://guest:guest@vvi-rabbitmq:5672/
      RABBITMQ_EXCHANGE: vvi.topic.exchange
    depends_on:
      - alert-db
    networks:
      - alert-internal
      - vinculo-vial

  alert-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alert
      POSTGRES_PASSWORD: alert
      POSTGRES_DB: alert
    volumes:
      - alert-db-data:/var/lib/postgresql/data
    networks:
      - alert-internal

volumes:
  alert-db-data:

networks:
  alert-internal:
    driver: bridge
  vinculo-vial:
    external: true
