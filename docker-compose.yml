services:
  alert:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://alert:alert@alert-db:5432/alert?sslmode=disable
      VEHICLE_INTERNAL_URL: http://vehicle:8081
      VEHICLE_TIMEOUT_MS: 2000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: vvi.topic.exchange
    depends_on:
      - alert-db

  alert-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alert
      POSTGRES_PASSWORD: alert
      POSTGRES_DB: alert
    ports:
      - "5433:5432"
    volumes:
      - alert-db-data:/var/lib/postgresql/data

volumes:
  alert-db-data:
